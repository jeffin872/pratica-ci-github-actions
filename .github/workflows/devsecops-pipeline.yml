name: Esteira DevSecOps (CI + Seguranca + Release)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  VERSAO_PYTHON: "3.14"
  REGISTRY: ghcr.io

jobs:
  # JOB 1: qualidade basica (Estudo Guiado 01)
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Baixar o codigo fonte
        uses: actions/checkout@v4

      - name: 2. Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.VERSAO_PYTHON }}

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Lint com Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 5. Testes com Pytest
        run: |
          pytest -v

  # JOB 2: seguranca (Shift-Left). Ordem: Secrets -> SAST -> SCA
  # Se um passo falhar, os seguintes NAO executam.
  security-scans:
    runs-on: ubuntu-24.04
    needs: lint-and-test
    steps:
      - name: 1. Baixar o codigo com TODO o historico (necessario p/ secrets)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.VERSAO_PYTHON }}

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: 5. SAST - Analise Estatica (Bandit)
        run: |
          bandit -r . -ll -ii

      - name: 6. SCA - Analise de Dependencias (Pip-Audit)
        run: |
          pip-audit -r requirements.txt

  # JOB 3: build, scan da imagem e publicacao no GHCR
  # So roda se lint-and-test E security-scans passarem (quality gate)
  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scans]
    permissions:
      contents: read
      packages: write
    steps:
      - name: 1. Baixar o codigo fonte
        uses: actions/checkout@v4

      - name: 2. Definir nome da imagem (GHCR exige minusculas)
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"

      - name: 3. Build da imagem Docker (local)
        run: |
          docker build -t "$IMAGE" .

      - name: 4. Scan da imagem com Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          # Ignora so o que NAO tem correcao publicada (Fixed Version vazia).
          # O que tem correcao continua bloqueando o pipeline.
          ignore-unfixed: true
          vuln-type: "os,library"

      - name: 5. Login no GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 6. Publicar a imagem no GHCR
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE"